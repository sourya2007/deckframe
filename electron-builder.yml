appId: com.deckframe.app
productName: DeckFrame
npmRebuild: false
directories:
  output: release/
files:
  - dist/**/*
  - dist-main/**/*
  - package.json
asarUnpack:
  - "**/node_modules/ffmpeg-static/**"
  - "**/node_modules/ffprobe-static/**"
  - "**/node_modules/uiohook-napi/**"
win:
  target:
    - nsis
    - portable
  icon: build/icon.ico
  certificateFile: null
  sign: null
  signAndEditExecutable: false
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
